# 雪球分析 Skill V3 配置

# LLM API 配置
llm:
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  api_key: "${DEEPSEEK_API_KEY}"
  max_tokens: 32000
  temperature: 0.3

# 爬虫配置
crawler:
  headless: true
  delay_min: 3
  delay_max: 8
  timeout: 30000
  default_max_pages: 1000        # 硬上限兜底（配合 --max-items=0 使用）
  max_items_fallback: 2000       # max_items 隐含上限
  auto_max_rounds: 20            # auto 模式最大迭代轮次

# 评估配置
evaluator:
  score_threshold: 150
  max_rounds: 3

# 数据质量检测配置（Layer 1 硬指标）
quality:
  health_threshold: 70          # 爬取健康分下限（低于此值跳过LLM评估直接重爬）
  news_min_ratio: 0.5           # 资讯有内容率最低要求
  notice_min_ratio: 0.3         # 公告有内容率最低要求
  min_content_length: 20        # 最短正文长度
  min_article_length: 200       # 最短文章长度

# 存储配置
storage:
  data_dir: "data"
  logs_dir: "logs"

# 分析配置
analysis:
  max_discussions: 10
  max_news: 10
  max_articles: 5

# 通知配置
notify:
  gist: false
  feishu: false

# 内容分级配置 (ContentGrader)
grader:
  enabled: true
  threshold: 10  # combined ≥ 10 入选高质量
